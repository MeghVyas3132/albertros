name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          LIVE: '1'
      - run: npx vite build
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: albertros.sarif
